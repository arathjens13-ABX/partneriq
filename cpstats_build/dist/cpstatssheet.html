<head>

  <style>
/* ============================================================
   CP STATS SHEET — Styles
   Design tokens and component styles.
   Only includes what is needed for this dashboard.
   ============================================================ */

:root {
  --bg: #0A0A0B;
  --bg-elev: #141416;
  --bg-elev-2: #1B1C1F;
  --bg-elev-3: #25262A;
  --border: #2B2D31;
  --border-soft: #212328;
  --text: #F4F5F6;
  --text-dim: #C2C4C7;
  --text-muted: #929598;
  --accent: #C8102E;
  --accent-soft: #E03A56;
  --accent-line: rgba(200, 16, 46, 0.42);
  --positive: #6FCF97;
  --negative: #FF7A8A;
  --neutral: #929598;
  --font-body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;

  --brand-red: #C8102E;
  --brand-red-dark: #A6192E;
  --brand-red-tint: rgba(200, 16, 46, 0.10);
  --brand-red-tint-strong: rgba(200, 16, 46, 0.18);
}

[data-theme="light"] {
  --bg: #F4F5F7;
  --bg-elev: #FFFFFF;
  --bg-elev-2: #ECEEF2;
  --bg-elev-3: #E3E6EB;
  --border: #D5D8DF;
  --border-soft: #E6E9EE;
  --text: #0E0F12;
  --text-dim: #3B3E45;
  --text-muted: #6E7178;
  --accent-line: rgba(200, 16, 46, 0.30);
  --positive: #1A8A4A;
  --negative: #D63040;
  --brand-red-tint: rgba(200, 16, 46, 0.07);
  --brand-red-tint-strong: rgba(200, 16, 46, 0.13);
}

/* Theme toggle icon visibility */
#themeIconSun { display: block; }
#themeIconMoon { display: none; }
[data-theme="light"] #themeIconSun { display: none; }
[data-theme="light"] #themeIconMoon { display: block; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   HEADER
   ============================================================ */
header {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-inner {
  max-width: 1600px;
  margin: 0 auto;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mark {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  letter-spacing: -0.01em;
}

.logo-divider {
  width: 1px;
  height: 14px;
  background: var(--border);
}

.logo-text {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  border-color: var(--text-dim);
  background: var(--bg-elev);
}

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
main {
  flex: 1;
  max-width: 1600px;
  margin: 0 auto;
  padding: 32px;
  width: 100%;
}

/* ============================================================
   BRAND HEADER
   ============================================================ */
.brand-header {
  margin-bottom: 36px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: end;
}

.brand-title-block .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.brand-title {
  font-weight: 500;
  font-size: 40px;
  line-height: 1.05;
  letter-spacing: -0.025em;
  color: var(--text);
}

.brand-subtitle {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.channel-tag {
  display: inline-block;
  padding: 3px 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 10px;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: transparent;
}

.channel-tag.active {
  border-color: var(--text-dim);
  color: var(--text);
  background: var(--bg-elev);
}

/* ============================================================
   DATA STATUS BAR
   ============================================================ */
.data-status {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  padding: 12px 18px;
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-dim);
}

.data-status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--positive);
  border-radius: 50%;
  margin-right: 7px;
}

.data-status strong {
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  font-weight: 500;
}

/* ============================================================
   COLLAPSIBLE SECTIONS
   ============================================================ */
.section {
  margin-bottom: 48px;
}

.section-title {
  font-weight: 500;
  font-size: 18px;
  line-height: 1;
  letter-spacing: -0.015em;
}

.section.collapsible {
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-elev);
  overflow: hidden;
  transition: border-color 0.15s;
}

.section.collapsible:hover { border-color: var(--accent-line); }
.section.collapsible.open  { border-color: var(--accent-line); }

.section.collapsible .section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
  border-bottom: none;
  margin-bottom: 0;
}

.section.collapsible .section-header:hover { background: var(--bg-elev-2); }

.section.collapsible.open .section-header {
  border-bottom: 1px solid var(--border-soft);
}

.section-toggle-arrow {
  color: var(--text-muted);
  font-size: 12px;
  font-family: var(--font-mono);
  transition: transform 0.18s ease;
  flex-shrink: 0;
}

.section.collapsible.open .section-toggle-arrow {
  transform: rotate(90deg);
}

.section-body {
  padding: 0 22px 24px;
}

.section.collapsible:not(.open) .section-body { display: none; }
.section.collapsible.open .section-body { padding-top: 22px; }

/* ============================================================
   KPI CARDS (home-grid / home-card)
   ============================================================ */
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.home-card {
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 22px;
}

.home-card-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.home-card-value {
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--text);
  font-weight: 500;
}

/* ============================================================
   TOOLTIP
   ============================================================ */
.tooltip {
  position: fixed;
  z-index: 9999;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 12px;
  line-height: 1.5;
  max-width: 320px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.7);
  pointer-events: none;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.12s, transform 0.12s;
  font-family: var(--font-body);
}

.tooltip.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ============================================================
   FOOTER
   ============================================================ */
footer {
  text-align: center;
  padding: 28px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-top: 1px solid var(--border);
}

/* ============================================================
   BACK TO TOP
   ============================================================ */
.back-to-top {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 40px;
  height: 40px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  z-index: 90;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s, border-color 0.15s;
  pointer-events: none;
}

.back-to-top.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.back-to-top:hover {
  border-color: var(--text-dim);
  color: var(--text);
  background: var(--bg-elev-3);
}

/* ============================================================
   DELTA BADGE
   ============================================================ */
.delta-badge {
  display: inline-block;
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 500;
}
.delta-badge.positive {
  background: rgba(111, 207, 151, 0.12);
  color: var(--positive);
}
.delta-badge.negative {
  background: rgba(255, 122, 138, 0.12);
  color: var(--negative);
}
.delta-badge.neutral {
  background: var(--bg-elev-3);
  color: var(--text-muted);
}
[data-theme="light"] .delta-badge.positive { background: rgba(26, 138, 74, 0.10); }
[data-theme="light"] .delta-badge.negative { background: rgba(214, 48, 64, 0.10); }

/* ============================================================
   NOTE INDICATOR  (ⓘ tooltip trigger on KPI cards)
   ============================================================ */
.home-card.has-note { cursor: help; }
.note-indicator {
  font-style: normal;
  font-size: 9px;
  color: var(--text-muted);
  vertical-align: middle;
  margin-left: 3px;
  opacity: 0.6;
  transition: opacity 0.1s;
}
.home-card.has-note:hover .note-indicator { opacity: 1; color: var(--accent-soft); }

/* ============================================================
   SECTION NAV  (jump-to pill strip)
   ============================================================ */
.section-nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 18px;
  margin-bottom: 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.section-nav::-webkit-scrollbar { display: none; }

.section-nav-pill {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-elev);
  color: var(--text-dim);
  font-size: 12px;
  font-family: var(--font-body);
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
  flex-shrink: 0;
}
.section-nav-pill:hover {
  border-color: var(--accent-line);
  color: var(--text);
  background: var(--bg-elev-2);
}

/* ============================================================
   SEARCH BAR
   ============================================================ */
.search-wrap {
  position: relative;
  margin-bottom: 18px;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}
.section-search {
  width: 100%;
  max-width: 400px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 9px 12px 9px 36px;
  outline: none;
  transition: border-color 0.15s;
}
.section-search::placeholder { color: var(--text-muted); }
.section-search:focus { border-color: var(--text-dim); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px) {
  .header-inner { padding: 14px 20px; }
  main { padding: 20px; }
  .brand-title { font-size: 28px; }
  .brand-header { grid-template-columns: 1fr; }
  .home-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
}

  </style>
</head>

// NUMBER FORMATTING
// ============================================================
function formatNum(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (abs >= 10000) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return n.toLocaleString('en-US');
}

function formatCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e6) return '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (abs >= 10000) return '$' + (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return '$' + n.toLocaleString('en-US');
}

// ============================================================
// YOY DELTA
// opts.pp   = true  → show absolute percentage-point change (e.g. "+3pp")
//                     use for metrics already expressed as percentages
// default         → relative % change (e.g. "+8.5%")
// ============================================================
function yoyDelta(curr, prior, opts) {
  if (!prior) return null;
  if (curr === null || curr === undefined) return null;
  opts = opts || {};
  var diff = curr - prior;
  if (opts.pp) {
    var diffRounded = Math.round(diff * 10) / 10;
    return {
      label: (diffRounded >= 0 ? '+' : '') + diffRounded + 'pp',
      dir: diffRounded > 0.5 ? 'positive' : diffRounded < -0.5 ? 'negative' : 'neutral',
    };
  }
  var pct = (diff / prior) * 100;
  var pctRounded = Math.round(pct * 10) / 10;
  return {
    label: (pctRounded >= 0 ? '+' : '') + pctRounded + '%',
    dir: pctRounded > 0.5 ? 'positive' : pctRounded < -0.5 ? 'negative' : 'neutral',
  };
}

// ============================================================
// TOOLTIP
// ============================================================
function showTooltip(e, text) {
  var t = document.getElementById('tooltip');
  if (!t) return;
  t.innerHTML = text;
  t.style.left = (e.clientX + 14) + 'px';
  t.style.top  = (e.clientY - 8) + 'px';
  t.classList.add('visible');
}

function hideTooltip() {
  var t = document.getElementById('tooltip');
  if (t) t.classList.remove('visible');
}

// ============================================================
// ERROR TOAST
// ============================================================
function showErrorToast(msg) {
  let toast = document.getElementById('app-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-elev-3);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:6px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.2s;pointer-events:none;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 4000);
}

// ============================================================
// GLOBAL STATE
// ============================================================
var openSections = {};
var searchQuery  = '';

// ============================================================
// SECTION NAV  (jump-to pill strip)
// ============================================================
function renderSectionNav() {
  var items = [
    { id: 'stats-social',    label: '📱 Social' },
    { id: 'stats-arena',     label: '🏟️ Arena' },
    { id: 'stats-stm',       label: '🎟️ STM' },
    { id: 'stats-hhi',       label: '💵 Income' },
    { id: 'stats-portland',  label: '🌲 Portland' },
    { id: 'stats-broadcast', label: '📡 Broadcast' },
    { id: 'stats-digital',   label: '📲 Digital' },
    { id: 'stats-sentiment', label: '💬 Sentiment' },
  ];
  return '<nav class="section-nav" id="section-nav">' +
    items.map(function(item) {
      return '<a class="section-nav-pill" href="#' + item.id + '" data-nav-section="' + item.id + '">' + item.label + '</a>';
    }).join('') +
    '</nav>';
}

// ============================================================
// SEARCH BAR
// ============================================================
function renderSearchBar() {
  var escaped = searchQuery.replace(/"/g, '&quot;');
  return '<div class="search-wrap">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
    '<input class="section-search" id="section-search" type="text" placeholder="Search sections and metrics…" autocomplete="off" value="' + escaped + '">' +
    '</div>';
}

// ============================================================
// APP ROUTER — single-page, renders stats + applies search filter
// ============================================================
function renderApp() {
  var main = document.getElementById('main');
  if (!main) return;
  renderStatsPage(main);
  wireSectionToggles();
  if (typeof applySearchFilter === 'function') applySearchFilter();
}

// ============================================================
// SECTION TOGGLE & NAV WIRING
// ============================================================
function wireSectionToggles() {
  document.querySelectorAll('[data-section-toggle]').forEach(function(el) {
    if (el.dataset.sectionToggleWired) return;
    el.dataset.sectionToggleWired = '1';
    el.addEventListener('click', function() {
      var id = el.dataset.sectionToggle;
      openSections[id] = !openSections[id];
      renderApp();
    });
  });

  document.querySelectorAll('[data-nav-section]').forEach(function(pill) {
    if (pill.dataset.navWired) return;
    pill.dataset.navWired = '1';
    pill.addEventListener('click', function(e) {
      e.preventDefault();
      var id = pill.dataset.navSection;
      // clear search so the target section is always visible
      searchQuery = '';
      var searchInput = document.getElementById('section-search');
      if (searchInput) searchInput.value = '';
      if (openSections[id] === false) {
        openSections[id] = true;
        renderApp();
      }
      requestAnimationFrame(function() {
        var sec = document.getElementById(id);
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  });
}

// ============================================================
// STATS PAGE RENDERER

  var fy = STATS_DATA.fiscalYear || '—';
  var s  = STATS_DATA;
  var p  = PRIOR_YEAR_DATA;
  var mn = METRIC_NOTES;

  function numVal(v) {
    return (!v && v !== 0) || v === 0 ? '—' : formatNum(v);
  }
  function pctVal(v) {
    return (!v && v !== 0) || v === 0 ? '—' : v + '%';
  }
  function dollarVal(v) {
    return (!v && v !== 0) || v === 0 ? '—' : formatCurrency(v);
  }
  function rawVal(v) {
    return (!v && v !== 0) || v === 0 ? '—' : v;
  }

  // opts: { delta, note, size }
  // size: 'full' spans all columns, 'half' spans 2 columns, default = auto
  function kpiCard(label, value, opts) {
    opts = opts || {};
    var delta = opts.delta;
    var note  = opts.note;
    var size  = opts.size;
    var sizeStyle = size === 'full' ? ' style="grid-column:1/-1;"'
                  : size === 'half' ? ' style="grid-column:span 2;"'
                  : '';
    var deltaHtml = delta
      ? '<div class="delta-badge ' + delta.dir + '">' + delta.label + ' YOY</div>'
      : '';
    var noteAttr  = note ? ' data-note="' + note.replace(/"/g, '&quot;') + '"' : '';
    var noteTick  = note ? ' <span class="note-indicator">&#9432;</span>' : '';
    return '<div class="home-card' + (note ? ' has-note' : '') + '"' + noteAttr + sizeStyle + '>' +
      '<div class="home-card-label">' + label + noteTick + '</div>' +
      '<div class="home-card-value">' + value + '</div>' +
      deltaHtml +
      '</div>';

  function subLabel(text) {
    return '<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);margin-top:20px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);">' + text + '</div>';
  }

  function kvTable(entries) {
    return '<table style="width:100%;border-collapse:collapse;">' +
      entries.map(function(pair) {

          '<td style="padding:8px 0;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em;width:55%;">' + pair[0] + '</td>' +
          '<td style="padding:8px 0;font-size:13px;color:var(--text);text-align:right;font-weight:500;">' + pair[1] + '</td>' +

      '</table>';

  function platformTable(platformData, valueFormatter) {

      keys.map(function(k) {

  // ---- Section content ----

  var socialContent =

    kvTable(Object.entries(s.arena.seatingCapacity).map(function(e) { return [e[0], numVal(e[1])]; }));

  var stmContent =

    '</div>';

  var hhiContent =

  var portlandContent =

    kpiCard('Median HHI',        dollarVal(s.portlandMarket.medianHHI),     { delta: yoyDelta(s.portlandMarket.medianHHI, p.portlandMarket.medianHHI) }) +
    kpiCard('College Educated',  pctVal(s.portlandMarket.collegeEducated),  { delta: yoyDelta(s.portlandMarket.collegeEducated, p.portlandMarket.collegeEducated, { pp: true }) }) +
    kpiCard('Homeownership',     pctVal(s.portlandMarket.homeownership),    { delta: yoyDelta(s.portlandMarket.homeownership, p.portlandMarket.homeownership, { pp: true }) }) +

  var broadcastContent =

    kpiCard('Season Reach',        numVal(s.broadcast.totalSeasonReach),    { delta: yoyDelta(s.broadcast.totalSeasonReach, p.broadcast.totalSeasonReach),       note: mn.totalSeasonReach }) +
    kpiCard('Local TV Games',      rawVal(s.broadcast.gamesOnLocalTV),      { delta: yoyDelta(s.broadcast.gamesOnLocalTV, p.broadcast.gamesOnLocalTV) }) +
    kpiCard('National TV Games',   rawVal(s.broadcast.gamesOnNationalTV),   { delta: yoyDelta(s.broadcast.gamesOnNationalTV, p.broadcast.gamesOnNationalTV) }) +
    kpiCard('Avg Local Rating',    rawVal(s.broadcast.avgLocalRating),      { delta: yoyDelta(s.broadcast.avgLocalRating, p.broadcast.avgLocalRating) }) +
    kpiCard('Broadcast Hours',     rawVal(s.broadcast.totalBroadcastHours), { delta: yoyDelta(s.broadcast.totalBroadcastHours, p.broadcast.totalBroadcastHours) }) +
    '</div>';

  var digitalContent =

    kpiCard('Total App Downloads',   numVal(s.appAndDigital.totalAppDownloads),      { delta: yoyDelta(s.appAndDigital.totalAppDownloads, p.appAndDigital.totalAppDownloads),           note: mn.totalAppDownloads }) +
    kpiCard('Avg Sessions / User',   rawVal(s.appAndDigital.avgSessionsPerUser),     { delta: yoyDelta(s.appAndDigital.avgSessionsPerUser, p.appAndDigital.avgSessionsPerUser) }) +

/* 05_wiring.js */
// ============================================================
// SEARCH FILTER — reads searchQuery global, hides non-matching sections.
// Searches section titles, KPI card labels, and table row labels.
// Defined globally so renderApp() can call it after each re-render.
// ============================================================
function applySearchFilter() {
  var q = searchQuery.trim().toLowerCase();
  document.querySelectorAll('.section.collapsible').forEach(function(sec) {
    if (!q) { sec.style.display = ''; return; }
    var titleEl = sec.querySelector('.section-title');
    var title   = titleEl ? titleEl.textContent.toLowerCase() : '';
    var cardLabels = Array.from(sec.querySelectorAll('.home-card-label')).map(function(el) {
      return el.textContent.toLowerCase();
    });
    var tableLabels = Array.from(sec.querySelectorAll('td:first-child')).map(function(el) {
      return el.textContent.toLowerCase();
    });
    var allText = [title].concat(cardLabels).concat(tableLabels).join(' ');
    sec.style.display = allText.includes(q) ? '' : 'none';
  });
}

// ============================================================
// APP INITIALIZATION & EVENT WIRING
// ============================================================
document.addEventListener('DOMContentLoaded', function() {

  // Theme toggle
  var themeToggleBtn = document.getElementById('themeToggleBtn');
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function() {
      if (document.documentElement.dataset.theme === 'light') {
        delete document.documentElement.dataset.theme;
      } else {
        document.documentElement.dataset.theme = 'light';
      }
    });
  }

  // Back-to-top button
  var backToTop = document.getElementById('backToTop');
  if (backToTop) {
    window.addEventListener('scroll', function() {
      backToTop.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
    backToTop.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // Search — delegated on document so it survives renderApp() re-renders
  document.addEventListener('input', function(e) {
    if (e.target && e.target.id === 'section-search') {
      searchQuery = e.target.value;
      applySearchFilter();
    }
  });

  // Tooltip — delegated on body so it works after any re-render
  document.body.addEventListener('mouseover', function(e) {
    var el = e.target.closest('[data-note]');
    if (el) showTooltip(e, el.dataset.note);
  });
  document.body.addEventListener('mousemove', function(e) {
    var t = document.getElementById('tooltip');
    if (t && t.classList.contains('visible')) {
      t.style.left = (e.clientX + 14) + 'px';
      t.style.top  = (e.clientY - 8) + 'px';
    }
  });
  document.body.addEventListener('mouseout', function(e) {
    if (e.target.closest('[data-note]')) hideTooltip();
  });

  // Initial render
  renderApp();
});
